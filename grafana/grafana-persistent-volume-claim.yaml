---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-persistent-volume-claim-nfs
  namespace: monitoring
  labels:
    storageclass.storage.k8s.io: storage-nfs
    persistentvolumes.k8s.io: grafana-persistent-volume-nfs
    persistentvolumeclaims.k8s.io: grafana-persistent-volume-claim-nfs
spec:
  storageClassName: storage-nfs
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 10Gi

