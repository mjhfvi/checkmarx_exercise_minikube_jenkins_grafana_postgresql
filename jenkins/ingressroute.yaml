---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jenkins-server
  # namespace: infrastructure
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`jenkins.minikube.local`)
    services:
    - name: jenkins
      port: 8080
      # namespace: infrastructure
  tls: {}
